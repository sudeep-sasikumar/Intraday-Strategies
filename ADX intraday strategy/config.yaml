# ADX intraday strategy - settings. The portal's Settings tab shows these; values changed
# there are kept in the portal's database and do not edit this file.
id: adx
name: ADX intraday
summary: Trade with the trend when the ADX line moves in between the DI+ and DI− lines from below; leave when it comes out the top.
timeframe_min: 15
params:
  - key: di_len
    label: DI length
    value: 14
    type: int
    min: 2
    max: 100
    help: Candles used for the DI+ and DI− lines (the video uses 14).
  - key: adx_len
    label: ADX smoothing
    value: 14
    type: int
    min: 2
    max: 100
    help: Candles used to smooth the ADX line (the video uses 14).
  - key: exit_on_di_swap
    label: Also exit if DI lines swap
    value: true
    type: bool
    help: Close the trade if DI+ and DI− change places (the trend flipped). Not stated in the video; my assumption.
