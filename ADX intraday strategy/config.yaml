# ADX intraday strategy - settings. The portal's Settings tab shows these; values changed
# there are kept in the portal's database and do not edit this file.
id: adx
name: ADX intraday
summary: Trade with the trend when the ADX line moves in between the DI+ and DI− lines from below; leave when it comes out the top.
timeframe_min: 15
params:
  - key: di_len
    label: DI length
    value: 14
    type: int
    min: 2
    max: 100
    help: Candles used for the DI+ and DI− lines (the video uses 14).
  - key: adx_len
    label: ADX smoothing
    value: 14
    type: int
    min: 2
    max: 100
    help: Candles used to smooth the ADX line (the video uses 14).
  - key: exit_on_di_swap
    label: Also exit if DI lines swap
    value: true
    type: bool
    help: Close the trade if DI+ and DI− change places (the trend flipped). Not stated in the video; my assumption.
  - key: stop_rule
    label: Stop loss rule
    value: candle
    type: choice
    choices: [candle, atr]
    help: candle = the other end of the setup candle (the video's rule). atr = a fixed multiple of the stock's average 15-minute candle range (ATR 14) from the entry.
  - key: stop_atr_mult
    label: Stop distance (x ATR)
    value: 2.0
    type: float
    min: 0.25
    max: 100
    help: Only used when the stop rule is atr. A very large number means, in effect, no stop.
  - key: target_r
    label: Profit target (x stop distance)
    value: 0
    type: float
    min: 0
    max: 20
    help: 0 = no target (the video's rule). 2 = take profit at twice the stop distance.
  - key: exit_on_adx
    label: Exit when ADX goes above both DI
    value: true
    type: bool
    help: The video's exit. Switch off to hold until the stop, the target or the 15:15 square-off.
  - key: min_stretch_pct
    filter: true
    label: Only stretched stocks (%, 0 = off)
    value: 0
    type: float
    min: 0
    max: 50
    help: Buy only if yesterday's close was at least this % below the stock's 20-day average (sell only if that much above).
  - key: max_price
    filter: true
    label: Only shares priced under (₹, 0 = off)
    value: 0
    type: float
    min: 0
    max: 1000000
    help: Skip setups in shares at or above this price.
