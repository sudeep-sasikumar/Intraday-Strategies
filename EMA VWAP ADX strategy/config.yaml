# EMA 9/21 + VWAP + ADX - settings. The portal's Settings tab shows these; values changed there
# are kept in the portal's database and do not edit this file.
id: ema_vwap_adx
name: EMA + VWAP + ADX
summary: Trade a 9/21 EMA crossover only when price is on the right side of VWAP and ADX is above 20. 5-minute candles.
timeframe_min: 5
params:
  - key: ema_fast
    label: Fast EMA
    value: 9
    type: int
    min: 2
    max: 200
    help: The video uses 9.
  - key: ema_slow
    label: Slow EMA
    value: 21
    type: int
    min: 3
    max: 400
    help: The video uses 21. Its value on the confirmation candle is also the stop loss.
  - key: adx_len
    label: ADX length
    value: 14
    type: int
    min: 2
    max: 100
    help: The video leaves ADX at its default, 14.
  - key: adx_min
    label: ADX must be above
    value: 20
    type: float
    min: 0
    max: 100
    help: The video's rule is above 20, for buys and for sells.
  - key: min_vwap_gap_pct
    label: Minimum gap from VWAP (%)
    value: 0
    type: float
    min: 0
    max: 5
    help: The video wants a visible gap between price and VWAP but gives no number. 0 = any close beyond VWAP.
  - key: target_r
    label: Profit target (x stop distance)
    value: 2
    type: float
    min: 0
    max: 20
    help: The video uses 2 (risk 1 to make 2). 0 = no target.
  - key: exit_on_cross
    label: Exit on the opposite crossover
    value: false
    type: bool
    help: The video's alternative exit. Close the trade when the 9 EMA crosses back over the 21 EMA.
  - key: same_day_only
    label: Crossover must be today
    value: true
    type: bool
    help: Not stated in the video; my assumption. Off = a crossover from an earlier day can still be confirmed today.
  - key: candle_min
    label: Candle size (minutes)
    value: "5"
    type: choice
    choices: ["5", "15"]
    help: The video uses 5. On 15-minute candles there are about a third as many trades and each move is bigger.
  - key: stop_rule
    label: Stop loss rule
    value: ema
    type: choice
    choices: [ema, atr]
    help: ema = the slow EMA on the confirmation candle (the video's rule). atr = a multiple of the average candle range (ATR 14).
  - key: stop_atr_mult
    label: Stop distance (x ATR)
    value: 3.0
    type: float
    min: 0.25
    max: 100
    help: Only used when the stop rule is atr.
  - key: min_stretch_pct
    filter: true
    label: Only stretched stocks (%, 0 = off)
    value: 0
    type: float
    min: 0
    max: 50
    help: Buy only if yesterday's close was at least this % below the stock's 20-day average (sell only if that much above).
  - key: min_daily_di_against
    filter: true
    label: Daily trend against the trade (DI gap, 0 = off)
    value: 0
    type: float
    min: 0
    max: 100
    help: Buy only if yesterday's daily DI- was above DI+ by at least this much (sell - the reverse). A reversal filter.
  - key: max_price
    filter: true
    label: Only shares priced under (₹, 0 = off)
    value: 0
    type: float
    min: 0
    max: 1000000
    help: Skip setups in shares at or above this price.
