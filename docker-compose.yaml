# Intraday Strategies portal on the VPS (README "Running on the VPS").
# Made for Hostinger Docker Manager -> "Compose from URL" with this file's raw GitHub link:
#   https://raw.githubusercontent.com/sudeep-sasikumar/Intraday-Strategies/master/docker-compose.yaml
# The image is built by GitHub Actions (.github/workflows/docker-image.yml) on every push;
# a redeploy pulls the latest.
#
# HTTPS: uses the Traefik already running on the VPS (the same one the Ignition & Coil scanner
# uses). No port is published here.
#
# Environment variables to enter in Docker Manager:
#   PORTAL_PASSWORD   required - the portal login, pick a long one
#   DOMAIN            required - a DNS name pointing at this VPS that is NOT the one the scanner
#                     uses, e.g. strategies.yourdomain.com
services:
  portal:
    image: ghcr.io/sudeep-sasikumar/intraday-strategies:latest
    pull_policy: always                   # a redeploy picks up the newest image
    restart: unless-stopped
    environment:
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      PORTAL_COOKIE_SECURE: "true"        # the login cookie is only sent over HTTPS
    volumes:
      - portal_data:/app/var              # candles, database (runs, trades, settings), logs
    expose:
      - "8100"                            # reached only through Traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.intraday-strategies.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.intraday-strategies.entrypoints=websecure
      - traefik.http.routers.intraday-strategies.tls=true
      - traefik.http.routers.intraday-strategies.tls.certresolver=letsencrypt
      - traefik.http.services.intraday-strategies.loadbalancer.server.port=8100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  portal_data:
